            hook.x = canvas.width / 2;
            hook.isHandlingCatch = false;
            fishCaughtCount = 0;
            aiCaughtCount = 0;
            tvContinuousMove = 0;
            resetAndRepopulateFishes(true);
            submarine = null;
            const BOAT_Y_BASE = WATER_LEVEL + BOAT_CONFIG.height - BOAT_CONFIG.yDrawOffset;
            aiBoat = {
                x: canvas.width * 0.25,
                y: BOAT_Y_BASE,
                baseY: BOAT_Y_BASE,
                waveOffset: Math.random() * Math.PI * 2,
                direction: 1,
                propellerRotation: 0,
                knockbackForceX: 0,
                knockbackForceY: 0,
                knockbackRotation: 0,
                targetRotation: 0,
                isInKnockback: false,
                shakeDuration: 0,
                aiTargetX: null
            };
            aiHook = {
                x: aiBoat.x,
                y: aiBoat.y + BOAT_CONFIG.rodAttachmentPoint.y,
                width: 4,
                height: 13,
                speed: 4.5,
                ropeY: aiBoat.y + BOAT_CONFIG.rodAttachmentPoint.y,
                goingDown: false,
                caught: null,
                fishStruggle: 0,
                aiState: 'waiting',
                aiWaitTimer: 120,
                isHandlingCatch: false
            };
            boat.x = canvas.width * 0.75;
            boat.direction = -1;
            boat.isInKnockback = false;
            boat.knockbackForceX = 0;
            boat.knockbackForceY = 0;
            boat.knockbackRotation = 0;
            boat.targetRotation = 0;
            boat.shakeDuration = 0;
            boat.y = BOAT_Y_BASE;
            boat.baseY = BOAT_Y_BASE;
        }

        function resetFishState(isRewardStage) {
            birdSound.pause();
            birdSound.currentTime = 0;
            submarine = null;
            resetAndRepopulateFishes(isRewardStage);
        }

        function gameLoop() {
            ctx.globalCompositeOperation = 'source-over';
            if (isCelebrationFireworksActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            drawBackground();
            if (gameState === 'FREE_FISHING_REWARD' && submarine) {
                drawSubmarine();
            } else {
                drawCorals();
                drawSeabedDetails();
                items.forEach(item => {
                    if (item.type === 'vent') drawVentImage(item);
                    if (item.hasBall && item.ball) drawBall(item.ball);
                });
                drawFishes();
                drawBubbles();
                drawCrocodile();
            }
            drawWaterSurface();
            drawBoat(boat, BOAT_CONFIG, boatImage, boatImageLoaded);
            drawBoatEngine(boat, BOAT_CONFIG, false);
            if (gameState === 'FREE_FISHING_REWARD') {
                drawBoat(aiBoat, BOAT_CONFIG, boatImage, boatImageLoaded);
                drawBoatEngine(aiBoat, BOAT_CONFIG, true);
            }
            drawHookAndRope(hook, boat, BOAT_CONFIG);
            if (aiHook && aiBoat) {
                drawHookAndRope(aiHook, aiBoat, BOAT_CONFIG);
            }
            drawLetters();
            ctx.globalCompositeOperation = 'source-over';
            drawParticles();
            if (!gameOver && !resetMessage && !gameIsPaused) {
                const playerMoved = updateBoat(boat, false);
                let aiMoved = false;
                if (gameState === 'FREE_FISHING_REWARD') {
                    aiMoved = updateAiBoat();
                    updateSubmarine();
                }
                updateHook();
                updateSceneElements();
                updateCrocodile();
                if (playerMoved || aiMoved) {
                    if (propellerSound.paused) propellerSound.play().catch(e => {});
                } else {
                    if (!propellerSound.paused) propellerSound.pause();
                }
            }
            if (isCelebrationFireworksActive) {
                fireworksLaunchTimer--;
                if (fireworksLaunchTimer <= 0) {
                    launchRandomFirework();
                    fireworksLaunchTimer = FIREWORKS_LAUNCH_INTERVAL;
                }
            }
            drawScores();
            drawMessage();
            requestAnimationFrame(gameLoop);
        }

        function handleLetterSelection(e) {
            e.preventDefault();
            if (isTV || gameOver || rewardStageMessage || gameState !== 'WORD_BUILDING' || isCelebrationFireworksActive || isCheckingWord || resetMessage) return;
            const rect = canvas.getBoundingClientRect(),
                scaleX = canvas.width / rect.width,
                scaleY = canvas.height / rect.height;
            let clickX, clickY;
            if (e.changedTouches) {
                clickX = e.changedTouches[0].clientX;
                clickY = e.changedTouches[0].clientY;
            } else {
                clickX = e.clientX;
                clickY = e.clientY;
            }
            const canvasX = (clickX - rect.left) * scaleX,
                canvasY = (clickY - rect.top) * scaleY;
            let clickedLetterIndex = scatteredLetters.findIndex(l => Math.hypot(l.x - canvasX, l.y - canvasY) < 28);
            if (clickedLetterIndex >= 0) {
                selectLetter(clickedLetterIndex);
            }
        }

        function selectLetter(letterIndex) {
            if (letterIndex < 0 || letterIndex >= scatteredLetters.length || isCheckingWord) return;
            const clickedLetter = scatteredLetters[letterIndex];
            const nextEmptySlotIndex = placedLetters.indexOf(null);
            if (nextEmptySlotIndex === -1) return;
            clickSound.play().catch(e => {});
            placedLetters[nextEmptySlotIndex] = clickedLetter.char;
            placeSound.play();
            scatteredLetters.splice(letterIndex, 1);
            if (isTV && tvSelectedLetterIndex >= scatteredLetters.length && scatteredLetters.length > 0) {
                tvSelectedLetterIndex = scatteredLetters.length - 1;
            }
            // Use the same logic to get the target word form for comparison
            const targetWordWithTashdid = handleTashdid(targetWord.replace(/\s/g, ''));
            const targetWordProcessed = getPositionalForms(targetWordWithTashdid);
            if (placedLetters[nextEmptySlotIndex] !== targetWordProcessed[nextEmptySlotIndex]) {
                isCheckingWord = true;
                wrongSound.play().catch(e => {});
                letterSlots.forEach(slot => slot.isShaking = true);
                setTimeout(() => {
                    resetWordBuilding();
                }, 1500);
                return;
            }
            if (placedLetters.indexOf(null) === -1) {
                checkWordCompletion();
            }
        }

        function resetWordBuilding() {
            scatteredLetters = [];
            initialLetterPositions.forEach(pos => scatteredLetters.push({ ...pos
            }));
            placedLetters.fill(null);
            if (isTV) tvSelectedLetterIndex = 0;
            isCheckingWord = false;
        }

        function checkWordCompletion() {
            isCheckingWord = true;
            const targetWordWithTashdid = handleTashdid(targetWord.replace(/\s/g, ''));
            const targetWordProcessed = getPositionalForms(targetWordWithTashdid);
            const playerWord = placedLetters.join('');
            if (playerWord === targetWordProcessed.join('')) {
                playWordSuccessCelebration();
                setTimeout(() => {
                    isCheckingWord = false;
                    advanceToNextWordOrLevel();
                }, 3000);
            } else {
                wrongSound.play().catch(e => {});
                letterSlots.forEach(slot => slot.isShaking = true);
                setTimeout(() => {
                    resetWordBuilding();
                }, 1500);
            }
        }
        document.addEventListener("keydown", e => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) e.preventDefault();
            if (gameIsPaused) return;
            if (gameOver) {
                if (e.key === 'Enter') restartLevelBtn.click();
                return;
            };
            const canCastHook = !hook.goingDown && !hook.caught && (gameState === 'WORD_CATCHING' || gameState === 'FREE_FISHING_REWARD') && !ropeBurning && !failedItem && !rewardStageMessage && !resetMessage && !boat.isInKnockback && !isCelebrationFireworksActive && !isCheckingWord && !hook.isHandlingCatch;
            if (isTV) {
                if (e.key === "Enter" || e.key === " ") {
                    if (gameState === 'WORD_BUILDING') {
                        selectLetter(tvSelectedLetterIndex);
                    } else if (canCastHook) {
                        hook.goingDown = true;
                        hookDropSound.play().catch(e => {});
                        hook.castingAnimation = 15;
                        tvContinuousMove = 0;
                    }
                } else if (e.key === "ArrowLeft") {
                    if (canCastHook) tvContinuousMove = -1;
                } else if (e.key === "ArrowRight") {
                    if (canCastHook) tvContinuousMove = 1;
                } else if (e.key === "ArrowDown" && gameState === 'WORD_BUILDING') {
                    tvSelectedLetterIndex = (tvSelectedLetterIndex + 1) % scatteredLetters.length;
                } else if (e.key === "ArrowUp" && gameState === 'WORD_BUILDING') {
                    tvSelectedLetterIndex = (tvSelectedLetterIndex - 1 + scatteredLetters.length) % scatteredLetters.length;
                }
            } else {
                if (e.key === "ArrowDown") {
                    if (canCastHook) {
                        hook.goingDown = true;
                        hookDropSound.play().catch(e => {});
                        hook.castingAnimation = 15;
                    }
                } else if (e.key === "ArrowLeft") {
                    isMovingLeft = true;
                } else if (e.key === "ArrowRight") {
                    isMovingRight = true;
                }
            }
        });
        document.addEventListener("keyup", e => {
            if (!isTV) {
                if (e.key === "ArrowLeft") isMovingLeft = false;
                if (e.key === "ArrowRight") isMovingRight = false;
            }
        });
        restartLevelBtn.addEventListener('click', () => {
            initializeGame();
        });
        const passiveFalse = {
            passive: false
        };
        canvas.addEventListener("mousedown", handleLetterSelection, passiveFalse);
        canvas.addEventListener("touchstart", handleLetterSelection, passiveFalse);
        const canCastHookTouch = () => !hook.goingDown && !hook.caught && (gameState === 'WORD_CATCHING' || gameState === 'FREE_FISHING_REWARD') && !ropeBurning && !failedItem && !rewardStageMessage && !resetMessage && !boat.isInKnockback && !isCelebrationFireworksActive && !isCheckingWord && !hook.isHandlingCatch;
        downBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameIsPaused || gameOver || rewardStageMessage || resetMessage) return;
            if (canCastHookTouch()) {
                hook.goingDown = true;
                hookDropSound.play().catch(e => {});
                hook.castingAnimation = 15;
            }
        }, passiveFalse);
        leftBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            if (canCastHookTouch() && !gameIsPaused) isMovingLeft = true;
        }, passiveFalse);
        rightBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            if (canCastHookTouch() && !gameIsPaused) isMovingRight = true;
        }, passiveFalse);
        leftBtn.addEventListener('touchend', e => {
            e.preventDefault();
            isMovingLeft = false;
        }, passiveFalse);
        rightBtn.addEventListener('touchend', e => {
            e.preventDefault();
            isMovingRight = false;
        }, passiveFalse);
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            const loaded = loadGameState();
            if (!loaded) {
                startScreenSound.play().catch(e => console.log('Audio autoplay prevented.'));
            }
        });
    </script>
</body>
